[project]
name = "issue-radar-gateway"
version = "0.1.0"
description = "OpenAI-compatible LLM gateway with a swappable model backend."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
]

[project.optional-dependencies]
# Heavy and only needed for the local model backend: `uv sync --all-packages --extra local`
local = ["torch>=2.4", "transformers>=4.45"]
# The TF-IDF prompt-injection detector (D-017): `uv sync --all-packages --extra safety`
safety = ["scikit-learn>=1.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway"]
