[project]
name = "issue-radar"
version = "0.1.0"
description = "Find open-source issues worth contributing to."
requires-python = ">=3.12"
dependencies = ["issue-radar-gateway"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["services/gateway"]

[tool.uv.sources]
issue-radar-gateway = { workspace = true }
# CPU-only torch everywhere. On Linux, PyPI's torch is the CUDA build and pulls ~15 nvidia-*
# packages (GBs) that a CPU-only machine and its Docker images never use.
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true  # used only for packages pinned to it above

[dependency-groups]
# Benchmark scripts only (services/gateway/benchmarks): `uv sync --group bench`
bench = [
    "pyarrow>=17",
    "scikit-learn>=1.9",
]
dev = ["pytest>=8.3", "httpx2", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["services/gateway/tests"]
# Slow tests load the real model; deselected by default. Run them with: pytest -m slow
addopts = "--import-mode=importlib -m 'not slow'"
markers = ["slow: needs the real model (torch + cached weights); deselected by default"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["gateway"]
